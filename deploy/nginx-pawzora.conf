# Pawzora web server (EC2 #1). Install as /etc/nginx/conf.d/pawzora.conf, then:  sudo nginx -t && sudo systemctl reload nginx
#
# Replace:  API_PRIVATE_IP  -> the PRIVATE IP address of the API EC2 (e.g. 172.31.20.15)
#           shop.example.com -> your domain (or leave server_name as _ until you have one)
#
# The browser only ever talks to this server. nginx forwards /api and /uploads to the API EC2, so the
# login cookie is same-site and no CORS setup is needed.

server_tokens off;
limit_req_zone $binary_remote_addr zone=pz_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pz_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;                      # e.g. shop.example.com

    root /usr/share/nginx/html;         # the contents of frontend/dist
    index index.html;
    client_max_body_size 6m;            # image uploads are limited to 5 MB by the API

    # ---- security headers (applied to every response) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # React needs inline styles (style attributes). Fonts come from Google Fonts. Everything else is same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # After HTTPS is working, also add (inside the TLS server block):
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hidden files (.env, .git …) are never served
    location ~ /\.(?!well-known) { deny all; return 404; }

    # ---- API ----
    location /api/ {
        limit_req zone=pz_api burst=40 nodelay;
        proxy_pass http://API_PRIVATE_IP:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # set, not appended, so clients can't forge it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # extra-slow lane for password guessing, on top of the API's own limits
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=pz_auth burst=10 nodelay;
        proxy_pass http://API_PRIVATE_IP:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uploaded images live on the API server
    location /uploads/ {
        proxy_pass http://API_PRIVATE_IP:4000;
        proxy_set_header Host $host;
        expires 30d;                                        # file names are random, so they never change
    }

    # ---- the React app ----
    location /assets/ { expires 1y; try_files $uri =404; }  # built files have hashed names
    location /img/    { expires 30d; try_files $uri =404; }
    location = /index.html { expires -1; }                  # always fetch the latest app shell
    location / { try_files $uri /index.html; }              # React Router handles /shop, /account, /admin …
}

# ---- HTTPS ----
# Easiest: point your domain at this server's Elastic IP, then
#   sudo dnf install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d shop.example.com
# certbot adds the TLS server block and the HTTP -> HTTPS redirect for you and renews the certificate automatically.
# (If you put an AWS load balancer with an ACM certificate in front instead, terminate TLS there and set
#  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; and use the real_ip module for $remote_addr.)
